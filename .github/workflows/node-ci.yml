name: Node CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    if: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

  # When the Node job is skipped, GitHub marks the workflow as failed unless
  # another job succeeds. This no-op keeps the check green for Python-only PRs.
  skip-without-lockfile:
    if: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock') == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: No Node lockfile
        run: echo "No package-lock.json / yarn.lock found; skipping Node CI."
